[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-dental-ai"
version = "0.1.0"
description = "歯科レセプト UKE ファイルの解析ツール"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["new_dental_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
